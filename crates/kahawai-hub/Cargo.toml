[package]
name = "kahawai-hub"
version.workspace = true
edition.workspace = true

[dependencies]
kahawai-core = { workspace = true }
kahawai-media = { workspace = true }
kahawai-proto = { workspace = true }
kahawai-transport = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
bytes = "1"
rust-embed = { workspace = true }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["std"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
kahawai-transcoder = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
kahawai-mediahost = { workspace = true }
