[package]
name = "kahawai-hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# HUB-32c OCR tier. Default-on; --no-default-features drops the
# Tesseract/Leptonica linkage for minimal deployments. All-MIT-side
# linkage (leptess MIT, tesseract Apache-2.0) — subtile-ocr (GPL) is
# deliberately NOT used: we already decode PGS and VobSub to bitmaps.
default = ["ocr"]
ocr = ["dep:leptess"]

[dependencies]
leptess = { version = "0.14", optional = true }
kahawai-core = { workspace = true }
kahawai-media = { workspace = true }
kahawai-proto = { workspace = true }
kahawai-transport = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
bytes = "1"
xxhash-rust = { workspace = true }
reqwest = { workspace = true }
roxmltree = { workspace = true }
ipnet = { workspace = true }
tower-http = { workspace = true }
flate2 = { workspace = true }
image = { workspace = true }
md-5 = { workspace = true }
aes = { workspace = true }
async-trait = { workspace = true }
unicode-normalization = "0.1"
rust-embed = { workspace = true }
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["std"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
kahawai-transcoder = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true, features = ["util"] }
kahawai-mediahost = { workspace = true }
