[package]
name = "kahawai"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forwarded to the hub (HUB-32c): default-on OCR, droppable for
# Tesseract-free builds.
default = ["ocr"]
ocr = ["kahawai-hub/ocr"]

[dependencies]
kahawai-core = { workspace = true }
kahawai-hub = { workspace = true }
kahawai-media = { workspace = true }
kahawai-mediahost = { workspace = true }
kahawai-transcoder = { workspace = true }
kahawai-transport = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
