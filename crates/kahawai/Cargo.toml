[package]
name = "kahawai"
version.workspace = true
edition.workspace = true
license.workspace = true

# The everything binary, plus the hub daemon. This is the package that
# pulls SQLite, axum and Tesseract, which is why the satellites live in
# packages of their own rather than beside these bins.
[features]
default = ["ocr"]
# HUB-32c Tesseract linkage. Historically the GPL escape hatch for
# subtile-ocr; that crate was never linked (leptess is MIT), so today
# this only drops the Tesseract system dependency.
ocr = ["kahawai-hub/ocr"]

[[bin]]
name = "kahawai"
path = "src/bin/kahawai.rs"

[[bin]]
name = "kahawai-hub"
path = "src/bin/kahawai-hubd.rs"

[dependencies]
kahawai-core = { workspace = true }
kahawai-hub = { workspace = true }
kahawai-media = { workspace = true }
kahawai-mediahost = { workspace = true }
kahawai-mediahostd = { workspace = true }
kahawai-runtime = { workspace = true }
kahawai-transcoderd = { workspace = true }
kahawai-transport = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
