// Satellite control-plane links (AR-3, AR-7). Requires mTLS; the client
// certificate's URI SAN is the identity — no token in any message.
syntax = "proto3";
package kahawai.v1;

// SEC-7: certificate renewal over the already-authenticated channel. The
// hub admits the new fingerprint (DB + live allowlist) before the renewed
// certificate is returned, so a satellite can never lock itself out.
service Renewal {
  rpc Renew(RenewRequest) returns (RenewResponse);
}

message RenewRequest {
  bytes csr_der = 1;
}

message RenewResponse {
  string cert_pem = 1;
}

service MediahostLink {
  rpc Link(stream HostToHub) returns (stream HubToHost);
  // Byte plane (AR-10): opened by the host in response to OpenRead, bound
  // to a lease by the first chunk's token. The hub sends ReadRequests down;
  // the host answers each with data chunks ending in an eof marker.
  // ponytail: rides gRPC instead of the doc's raw framed-TCP listener —
  // same shapes, one less port; swap the transport if profiling demands.
  rpc ByteChannel(stream ByteChunk) returns (stream ReadRequest);
}

message HostToHub {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    AnnounceCollection announce_collection = 3;
    FileUpsert file_upsert = 4;
    FileError file_error = 5;
    ScanProgress scan_progress = 6;
    // Incremental rescan (MH-5): ask what the hub already knows, then
    // report unchanged files as seen without re-inspecting them.
    ManifestRequest manifest_request = 7;
    FilesSeen files_seen = 8;
    // ED2K results (MH-9), trickled in as the idle hasher finishes files.
    FileHashes file_hashes = 9;
    // Extracted subtitle tracks of one file (efficiency ladder step 2).
    FileSubtitles file_subtitles = 10;
    // Attachment declarations for one file (MH-4 backfill).
    FileAttachments file_attachments = 11;
    // HUB-32b: one image subtitle track's raw display-set blocks,
    // walked from the container index on the host's own disk.
    ImageSubtitles image_subtitles = 12;
    // Longest keyframe gap of one file (HUB-17 backfill).
    FileKeyframeInterval file_keyframe_interval = 13;
    // Protocol 3: targeted, non-scanning database root adoption.
    RootResolutions root_resolutions = 14;
    // Confirms receipt of the adoption-complete manifest. Until this lands,
    // reconnects repeat the harmless scan suppression.
    RootAdoptionAck root_adoption_ack = 15;
    // Targeted PAR/orientation/display-size result for one exact source.
    FileVideoGeometry file_video_geometry = 16;
    // Season-wide recap/intro/credits analysis performed against local paths.
    SegmentDetectionAccepted segment_detection_accepted = 17;
    SegmentDetectionResult segment_detection_result = 18;
    // Source-local EBU R128 measurements for every audio stream.
    FileLoudness file_loudness = 19;
  }
}

message FileSubtitles {
  string collection_id = 1;
  SourcePath source = 2;
  // Size at extraction time: the hub drops the result if the row moved on.
  uint64 size = 3;
  repeated SubTrack tracks = 4;
  // Whole-file failure (unreadable, no text tracks despite discovery…).
  string error = 5;
}

message SubTrack {
  // "e{n}" — same demux-order indexing as discovery and the session tap.
  string key = 1;
  // Faithful ASS script (ASS/SSA tracks), empty otherwise.
  string ass = 2;
  // Flattened cues as JSON [{start_ms,end_ms,text}…] (hub cache shape).
  string cues_json = 3;
}

message FileHashes {
  string collection_id = 1;
  repeated FileHash hashes = 2;
}

message FileHash {
  SourcePath source = 1;
  // eMule/AniDB variant (null chunk appended on exact chunk multiples).
  string ed2k_hex = 2;
  // Size at hash time: the hub ignores the result if the row moved on.
  uint64 size = 3;
  // Filename-embedded CRC32 verified during the same read (MH-9).
  bool crc_checked = 4;
  bool crc_ok = 5;
}

message ManifestRequest {
  string collection_id = 1;
  // The host's persisted scan generation. Non-zero and equal to the
  // hub's stored value → the hub answers in_sync and the host skips
  // the scan. 0 = no shortcut (watcher/sweep/manual cycles).
  uint64 sync_version = 2;
}

message FileStat {
  SourcePath source = 1;
  uint64 size = 2;
  int64 mtime_unix = 3;
  // The sidecars the hub has recorded for this file (.nfo, artwork), so
  // the host can notice one that appeared or vanished. Size and mtime
  // describe the MEDIA file and never move when a sidecar changes beside
  // it, which is why a dropped-in .nfo used to stay invisible forever.
  string sidecars = 4;
}

// The hub's current knowledge of a collection, chunked; `done` on the
// last chunk.
message Manifest {
  string collection_id = 1;
  repeated FileStat entries = 2;
  bool done = 3;
  // Versions matched: no entries follow, skip the scan entirely.
  bool in_sync = 4;
  // The hub filled FileStat.sidecars. Absent from an older hub, where an
  // empty signature means "not sent" rather than "none recorded", so the
  // host must not read anything into it.
  bool sidecars_compared = 5;
  // This in-sync answer completed database-only root adoption. The host
  // acknowledges it before ending the cycle so a crash cannot turn the next
  // reconnect into a generation-mismatch scan.
  bool root_adoption = 6;
}

// Files present and unchanged (size+mtime match the manifest): counted
// for reconciliation, no re-inspection, no upsert.
message FilesSeen {
  string collection_id = 1;
  repeated SourcePath sources = 2;
}

// A collection this mediahost serves (MH-1). Announced after Hello and
// whenever configuration changes.
message AnnounceCollection {
  // Stable per-mediahost collection identifier (the configured name).
  string id = 1;
  string media_type = 2; // series|movies|music|anime
  repeated CollectionRoot roots = 3;
}

message SourcePath {
  string root_token = 1;
  string path_rel = 2;
}

message CollectionRoot {
  string root_token = 1;
  string normalized_path = 2;
}

message RootResolutionWorklist {
  string collection_id = 1;
  repeated LegacySource sources = 2;
}

message LegacySource {
  string path_rel = 1;
  uint64 size = 2;
  uint64 head_xxh3 = 3;
  uint64 tail_xxh3 = 4;
  uint64 oshash = 5;
}

message RootResolutions {
  string collection_id = 1;
  repeated RootResolution resolutions = 2;
}

message RootAdoptionAck {
  string collection_id = 1;
}

message RootResolution {
  string path_rel = 1;
  // Present only when exactly one configured root matched every fact.
  optional SourcePath source = 2;
  // "missing" or "ambiguous" when source is absent.
  string error = 3;
}

message FileUpsert {
  string collection_id = 1;
  repeated FileRecord files = 2;
}

message FileRecord {
  SourcePath source = 1;
  uint64 size = 2;
  int64 mtime_unix = 3;
  // Content identity (MH-5): xxh3 of first/last 64 KiB.
  uint64 head_xxh3 = 4;
  uint64 tail_xxh3 = 5;
  // OpenSubtitles moviehash, same read pass (MH-5/HUB-22).
  uint64 oshash = 6;
  // kahawai_core::media::MediaInfo as JSON (schema evolves without proto churn).
  string streams_json = 7;
}

// Unreadable/corrupt file diagnostic (MH-8).
message FileError {
  string collection_id = 1;
  SourcePath source = 2;
  string error = 3;
}

message ScanProgress {
  string collection_id = 1;
  uint32 scanned = 2;
  uint32 failed = 3;
  bool complete = 4;
  uint32 skipped = 5; // unchanged, not re-inspected
  // Scan generation after this cycle; the hub stores it (see
  // ManifestRequest.sync_version).
  uint64 sync_version = 6;
}

message HubToHost {
  oneof msg {
    HelloAck hello_ack = 1;
    // Ask the host to open a ByteChannel for this file (MH-6). The lease
    // ends when the hub closes the channel's request stream.
    OpenRead open_read = 2;
    Manifest manifest = 3;
    // Admin-triggered incremental rescan ("" = every collection).
    RescanRequest rescan_request = 4;
    // Files the hub wants ED2K hashes for (MH-9, anime collections).
    // Consumed by the host's idle hasher; chunked, no ordering contract.
    Hashlist hashlist = 5;
    // Subtitle extraction: urgent single file (a viewer is waiting) …
    ExtractSubs extract_subs = 6;
    // … or background pre-warm, drained below the ED2K queue.
    SubsWorklist subs_worklist = 7;
    // MH-4 backfill: declare attachments and chapters for files scanned
    // before either existed. Cheapest tier (header reads only), one walk
    // of the container header for both.
    AttachmentsWorklist attachments_worklist = 8;
    // HUB-32b: read one image subtitle track's display-set blocks.
    // Index-driven and free on local disk; the hub cannot do this
    // itself because every read would cross the byte plane.
    ExtractImageSubs extract_image_subs = 9;
    // Keyframe-interval backfill for files scanned before it was
    // measured. Same cheapest tier as the attachment worklist: index
    // reads only, no decoding.
    KeyframeWorklist keyframe_worklist = 10;
    RootResolutionWorklist root_resolution_worklist = 11;
    // Files scanned before display geometry was recorded. This probes only
    // the named exact sources and never enters reconciliation.
    VideoGeometryWorklist video_geometry_worklist = 12;
    // HUB-37: analyze one ordered season against exact local sources.
    DetectSegments detect_segments = 13;
    // Full audio decode on the owning mediahost, idle-gated and cached.
    LoudnessWorklist loudness_worklist = 14;
  }
}

message KeyframeWorklist {
  string collection_id = 1;
  repeated SourcePath sources = 2;
}

message VideoGeometryWorklist {
  string collection_id = 1;
  repeated SourcePath sources = 2;
}

message FileVideoGeometry {
  string collection_id = 1;
  SourcePath source = 2;
  // Size at probe time: the hub drops a stale result after replacement.
  uint64 size = 3;
  // kahawai_core::media::VideoGeometry array. Empty only on failure.
  string geometry_json = 4;
  // A terminal source-owned failure; replaced by a later successful probe or
  // by the next FileUpsert for changed physical content.
  string error = 5;
}
message LoudnessWorklist {
  string collection_id = 1;
  int64 analyzer = 2;
  repeated SourcePath sources = 3;
}

message FileLoudness {
  string collection_id = 1;
  SourcePath source = 2;
  uint64 size = 3;
  int64 mtime_unix = 4;
  int64 analyzer = 5;
  repeated AudioLoudnessTrack tracks = 6;
  string error = 7;
}

message AudioLoudnessTrack {
  uint32 stream_index = 1;
  // Legacy analyzer-3 fields retained for mixed-minor peers.
  double integrated_lufs = 2;
  double true_peak_dbtp = 3;
  uint32 source_channels = 4;
  double native_integrated_lufs = 5;
  double native_true_peak_dbtp = 6;
  // Exact post-conversion layouts measured by analyzer 4 and later.
  repeated AudioLayoutLoudness layouts = 7;
  uint64 source_channel_mask = 8;
}

message AudioLayoutLoudness {
  uint32 channels = 1;
  uint64 channel_mask = 2;
  double integrated_lufs = 3;
  double true_peak_dbtp = 4;
}

message AudioLayoutGain {
  uint32 channels = 1;
  uint64 channel_mask = 2;
  double gain_db = 3;
}

message ExtractSubs {
  string collection_id = 1;
  SourcePath source = 2;
}

message ExtractImageSubs {
  string collection_id = 1;
  SourcePath source = 2;
  // Which subtitle track, in the e{n} numbering discovery uses.
  uint32 sub_index = 3;
}

/// One image subtitle track, undecoded: the payloads are still PGS
/// segments / VobSub SPUs, which is both the compact form and the one
/// the pipeline worker's own decoders take.
message ImageSubtitles {
  string collection_id = 1;
  SourcePath source = 2;
  uint32 sub_index = 3;
  // Matroska CodecID (S_HDMV/PGS, S_VOBSUB); empty = no such track.
  string codec = 4;
  // CodecPrivate: VobSub's .idx text (palette + canvas size).
  bytes codec_private = 5;
  repeated ImageSubBlock blocks = 6;
  string error = 7;
  // A track's blocks arrive in SEVERAL of these messages, the last one
  // saying done — the same shape Manifest uses, and for the same reason:
  // one message per track put a whole PGS stream on the wire at once,
  // and the largest that ever survived was 63.8 MiB against a 64 MiB
  // limit. Over it, the stream resets — and since this rides the shared
  // link stream, one oversized subtitle track took down scans, leases
  // and playback with it (measured 2026-08-07: 3663 extractions sent,
  // 24 arrived).
  optional bool done = 8;
}

message ImageSubBlock {
  uint64 start_ms = 1;
  // 0 = undeclared; the set then ends where the next one begins.
  uint64 duration_ms = 2;
  bytes payload = 3;
}

message SubsWorklist {
  string collection_id = 1;
  repeated SourcePath sources = 2;
}

message AttachmentsWorklist {
  string collection_id = 1;
  repeated SourcePath sources = 2;
}

message FileAttachments {
  string collection_id = 1;
  SourcePath source = 2;
  // Size at declaration time: the hub drops the result if the row moved on.
  uint64 size = 3;
  // JSON array of {file_name, mime_type, offset, size} — exactly what
  // MediaInfo.attachments serializes to. "[]" = checked, none found.
  string attachments_json = 4;
  // The chapters declared in the SAME sparse pass, as
  // MediaInfo.chapters serializes. Two facts read from one walk of the
  // container header rather than two worklists over the same files.
  // Absent = a host that predates chapters, which leaves the field null
  // and so keeps the file on the worklist for a host that does.
  optional string chapters_json = 5;
}

message FileKeyframeInterval {
  string collection_id = 1;
  SourcePath source = 2;
  // Size at measurement time: the hub drops the result if the row moved on.
  uint64 size = 3;
  // Longest gap between keyframes. Absent = measured and UNKNOWN (a
  // container with no index we can read), which is not the same as 0
  // and must not be treated as "cuts possible anywhere".
  optional uint32 max_keyframe_interval_ms = 4;
}

message DetectSegments {
  string request_id = 1;
  int64 detector = 2;
  string collection_id = 3;
  bool anime = 4;
  repeated SegmentEpisode episodes = 5;
}

message SegmentEpisode {
  // Opaque hub item identity, returned only for correlation.
  string item_id = 1;
  SourcePath source = 2;
  uint64 expected_size = 3;
  int64 expected_mtime_unix = 4;
  uint64 duration_ms = 5;
}

enum SegmentDetectionRejection {
  SEGMENT_DETECTION_REJECTION_UNSPECIFIED = 0;
  SEGMENT_DETECTION_REJECTION_UNSUPPORTED_DETECTOR = 1;
}

message SegmentDetectionAccepted {
  string request_id = 1;
  // "queued" | "running" | "rejected". Rejection meaning is typed below so
  // older hubs still recognize the terminal state and release their waiter.
  string state = 2;
  string error = 3;
  SegmentDetectionRejection rejection = 4;
}

message SegmentDetectionResult {
  string request_id = 1;
  int64 detector = 2;
  uint64 elapsed_ms = 3;
  repeated SegmentEpisodeResult episodes = 4;
  string error = 5;
}

message SegmentEpisodeResult {
  string item_id = 1;
  SourcePath source = 2;
  uint64 observed_size = 3;
  int64 observed_mtime_unix = 4;
  bool unreadable = 5;
  string error = 6;
  repeated DetectedSegment segments = 7;
  // The source itself was readable, but too few siblings remained for a
  // season comparison. Keep it pending without recording a source failure.
  bool retryable = 8;
}

message DetectedSegment {
  // "recap" | "intro" | "credits"
  string kind = 1;
  uint64 start_ms = 2;
  uint64 end_ms = 3;
  // "chromaprint" | "blackframe"
  string analyzer = 4;
}

message Hashlist {
  string collection_id = 1;
  repeated SourcePath sources = 2;
}

message RescanRequest {
  string collection_id = 1;
}

message OpenRead {
  string lease_token = 1;
  string collection_id = 2;
  SourcePath source = 3;
  // Whether this lease is the hub's own background work (currently local NFO
  // enrichment) rather than a viewer. Subtitle and artwork leases open as
  // viewers because a client is waiting on them.
  //
  // The host schedules its own hashes, declarations, probes and extractions
  // around foreground serving. Background leases are served identically and
  // simply do not count as somebody waiting.
  //
  // Default false, so a hub too old to say means "a viewer", which is the
  // safe reading.
  bool background = 4;
}

message ByteChunk {
  // Set on the first chunk only: binds the channel to a lease.
  string lease_token = 1;
  uint64 offset = 2;
  bytes data = 3;
  // Marks the end of one ReadRequest's data.
  bool eof = 4;
  string error = 5;
}

message ReadRequest {
  uint64 offset = 1;
  uint64 len = 2;
}

// First message on every link (AR-7): version negotiation input.
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string name = 3;
  // Build stamp of the connecting binary (commit + build time), logged
  // by the hub so "which build is that box running?" is answerable from
  // the hub's own log instead of a shell on the satellite.
  string build = 4;
  // Detector algorithm generation this peer can execute. Mediahosts set the
  // shared DETECTOR_GENERATION; peers that do not run segment analysis and
  // older binaries leave zero. The hub uses this before dispatch so a rolling
  // upgrade is host capability weather, not a failed season.
  int64 segment_detector_generation = 5;
}

message HelloAck {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
}

message Heartbeat {}

// ---- Transcoder control link (§6, M3) ------------------------------------

service TranscoderLink {
  rpc Link(stream TcToHub) returns (stream HubToTc);
}

message TcToHub {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    // Sent once after HelloAck (TC-1): what this box can actually do,
    // every element dry-run-verified at startup.
    CapabilityReport capabilities = 3;
    SessionReady session_ready = 4;
    SessionError session_error = 5;
    // Source byte plane and artifact delivery ride the control link
    // (ponytail: same shapes as a dedicated channel, one less stream;
    // split out if profiling demands).
    SourceRead source_read = 6;
    ArtifactData artifact_data = 7;
    // HUB-36: what this box actually achieved, sent on the heartbeat
    // tick. A NEW kind rather than fields inside Heartbeat{}, which is
    // shared with the mediahost link.
    PaceReport pace_report = 8;
    // OPS-10: this session's diagnostics, gathered from the run dir.
    // Sent unsolicited at session end — the run dir is deleted
    // synchronously right after, so there is no later window — and in
    // answer to CollectLogs for a session still running.
    SessionLogs session_logs = 9;
  }
}

// One session's satellite-side diagnostics, already assembled as text.
// Assembled rather than shipped as fields because the reader is a human
// pasting it into a bug report, and because what is worth including
// differs per pipeline (a TS session has a first-segment summary, an
// fMP4 one does not).
message SessionLogs {
  string session_id = 1;
  string body = 2;
}

// One finished run's un-throttled production rate. The transcoder
// reports only what it measured; the hub owns the work-class the
// sample belongs to, because it holds the MediaInfo and the plan and
// the two must never disagree.
message PaceSample {
  string session_id = 1;
  // Realtime multiple: content seconds produced per wall second.
  float multiple = 2;
}

message PaceReport {
  repeated PaceSample samples = 1;
  // Bytes/sec the source plane sustained on large reads, EWMA. 0 =
  // nothing large enough measured yet — absence, not "no bandwidth".
  uint64 link_bytes_per_sec = 2;
}

message SessionReady {
  string session_id = 1;
  // Facts the pipeline learned while prerolling that the negotiation
  // could not know (AR-13 honest degradation): e.g. the encoder folded
  // 7.1 to 5.1, discovered only when the decoder's caps arrived. The
  // hub folds them into the session verdict, so the client is told what
  // is actually playing rather than what was planned.
  repeated SessionFact facts = 2;
}

message SessionFact {
  // Which verdict this amends: "audio" | "video". Unknown kinds are
  // surfaced but amend nothing.
  string kind = 1;
  // Short human phrase in the decision's terms, e.g. "7.1 → 5.1".
  string detail = 2;
}

message SessionError {
  string session_id = 1;
  string error = 2;
  // The failed worker's stderr, tail-capped. A pipeline worker that
  // aborts writes its Rust panic — message, file and line — to stderr,
  // and that is the only place the cause appears; the `error` string
  // above carries just the last few lines, which on a panic are the
  // backtrace frames and not the message. The satellite's own copy is
  // deleted by the very next attempt, so it ships here to be kept with
  // the hub's (crates/kahawai-hub/src/crashlog.rs).
  string worker_log = 3;
}

// Transcoder pulls source bytes. `req` correlates request/response:
// session_id alone is NOT enough — a seek-restart reuses the session id,
// and a read left in flight by the killed worker must never satisfy the
// new worker's first read (observed: avidemux fed mid-file bytes as a
// header).
message SourceRead {
  string session_id = 1;
  uint64 offset = 2;
  uint64 len = 3;
  uint64 req = 4;
  // Which part of a split source (CD1/CD2) this read is for, indexed from
  // the session's starting part. Absent/0 = the first — what every
  // single-part session and every pre-split transcoder sends.
  uint32 part = 5;
}

message SourceData {
  string session_id = 1;
  uint64 offset = 2;
  // Shorter than requested (including empty) = EOF at that offset.
  bytes data = 3;
  uint64 req = 4;
  uint32 part = 5;
}

// One artifact (playlist/segment) streamed in chunks, eof-terminated.
message ArtifactData {
  string session_id = 1;
  string name = 2;
  bytes data = 3;
  bool eof = 4;
  string error = 5;
}

message CapabilityReport {
  repeated EncoderCap encoders = 1;
  uint32 max_sessions = 2;
  // Caps names this box can decode (registry-derived). Placement must
  // match the SOURCE codec too: a box can own a great encoder and still
  // decode AV1 at 0.3x realtime in software (observed on a J5005).
  repeated string decode_caps = 3;
  // HUB-15a: the GL tone-map segment (glshader + friends) is available.
  bool tonemap = 4;
  // HUB-36: the same segment MEASURED, as realtime multiples against a
  // 24 fps reference. "Available" said yes for a box that sustains
  // 1.7x at 1080p and 0.65x at 2160p — it answered "can you" where
  // placement needed "can you keep up". Absent = unmeasured.
  optional float tonemap_speed_1080 = 5;
  optional float tonemap_speed_2160 = 6;
  // HUB-32a: this box can burn ASS/SSA into the picture (libass via
  // `assrender`), dry-run-verified into a real encoder per AR-13a.
  // NOT universal — absent on macOS in this fleet — so placement
  // FILTERS on it: an ASS burn has no honest degradation, the session
  // says so instead (owner decision 2026-08-02).
  bool ass_burn = 7;
}

message EncoderCap {
  string codec = 1;   // h264 | aac | ...
  string element = 2; // the verified GStreamer element
  bool hardware = 3;  // hw-accelerated (placement prefers these)
  // HUB-36: measured realtime multiples (frames/sec / 24) at 1080p and
  // 2160p, from a reference transcode. ABSENT means unmeasured — a
  // legacy satellite, or the first boot before the background
  // benchmark lands — which consumers read as "no data, assume
  // sufficient". A PRESENT near-zero value means the opposite:
  // measured, and catastrophically slow. Explicit presence keeps those
  // two apart; a 0.0 sentinel conflated them and would have sent 4K
  // AV1 to the one box that cannot do it.
  // Video codecs only: audio encodes run hundreds of times realtime on
  // every box, and a number that never decides anything is noise.
  optional float speed_1080 = 4;
  optional float speed_2160 = 5;
}

message HubToTc {
  oneof msg {
    HelloAck hello_ack = 1;
    StartSession start_session = 2;
    EndSession end_session = 3;
    SourceData source_data = 4;
    FetchArtifact fetch_artifact = 5;
    // Pacing (§4.6): the viewer's last reported position, forwarded so
    // the worker can throttle its lead.
    ViewerPosition viewer_position = 6;
    // Liveness probe: macOS App Nap defers idle processes' timers (their
    // own heartbeat ticker stalls) but socket reads always wake them, so
    // the hub pings and the transcoder answers with a Heartbeat.
    Ping ping = 7;
    // OPS-10: hand me this running session's diagnostics. Only for a
    // LIVE session; once it ends the bundle is already stored hub-side.
    CollectLogs collect_logs = 8;
  }
}

message Ping {}

message ViewerPosition {
  string session_id = 1;
  uint64 position_ms = 2;
}

message StartSession {
  string session_id = 1;
  uint64 size = 2;
  string video = 3; // copy | encode | off
  string audio = 4;
  // Seek-restart (§6): begin at this offset (keyframe-snapped).
  uint64 start_ms = 5;
  // HLS sink override (empty = preference order). Set on retry after a
  // sink crash (TC-6 fallback: hlssink3 bugs, hlssink2 works).
  string sink = 6;
  // Track indexes in discovery order (HUB-27). Old transcoders
  // ignore these and play track 0.
  uint32 audio_track = 7;
  uint32 video_track = 8;
  // Sizes of the remaining parts of a split source in timeline order,
  // EXCLUDING the first (that is `size`). A transcoder that understands
  // this joins them into one pipeline and plays the CD1->CD2 boundary
  // without restarting; one that does not ignores it and restarts, which
  // is exactly today's behaviour.
  repeated uint64 tail_sizes = 9;
  // HUB-15 encode parameters; 0 = unset (historical fixed values). Old
  // transcoders ignore them entirely.
  uint32 video_kbps = 10;
  uint32 max_height = 11;
  uint32 max_channels = 12;
  // HUB-15a: tone-map HDR video to SDR in the encode chain (GL shader).
  // Only set when this box reported the capability.
  bool tone_map = 13;
  // HUB-32b: burn this image subtitle track into the picture, as
  // 1 + the e{n} index (0 = burn nothing, so old transcoders that
  // ignore the field simply do not burn).
  uint32 burn_subtitle = 14;
  // The display sets to burn, in the worker's own on-disk format. Sent
  // with the session because a dispatched worker can no more walk the
  // source index than the hub can — every read would cross the byte
  // plane. Empty = nothing to burn.
  bytes burn_sets = 15;
  // HUB-15b encode targets and segment container. Empty = the legacy
  // h264 / aac / ts. Safe by construction on old transcoders: placement
  // hard-filters on the reported encoder set, and an old binary never
  // reports hevc/av1/opus, so a non-default value cannot reach one.
  string video_codec = 16; // h264 | hevc | av1
  string audio_codec = 17; // aac | opus
  string container = 18;   // ts | fmp4
  // HUB-32a: burn this EMBEDDED text subtitle track into the picture
  // with libass, as 1 + the e{n} index (0 = none), same encoding and
  // same old-transcoder safety as burn_subtitle. Placement hard-filters
  // on the reported `ass_burn` capability, so this only ever reaches a
  // box that has assrender.
  uint32 burn_ass = 19;
  // A user's own sidecar .ass, sent whole for the same reason burn_sets
  // is: the worker cannot read the source's neighbourhood. Empty = none.
  // Embedded tracks do NOT come this way — they are burned from the
  // demuxer's pad, the only path carrying the file's attached fonts.
  bytes burn_ass_file = 20;
  // The source carries fields, so the encode chain deinterlaces before
  // anything reads the picture. Sent rather than re-derived because the
  // worker never sees the file, only the bytes it is fed. An old
  // transcoder ignoring this encodes fields, which is what it did before.
  bool deinterlace = 21;
  // Gain measured on the exact stereo fold. NaN means unmeasured; applied
  // only when the encoded output is stereo.
  double stereo_gain_db = 22;
  // Gain measured on the untouched decoded layout. Applied only when the
  // encoded channel count still equals loudness_source_channels.
  double native_gain_db = 23;
  uint32 loudness_source_channels = 24;
  // Exact layout-keyed gains. Minor-4 workers ignore this and retain the
  // stereo/native fields above; placement gates layouts they cannot express.
  repeated AudioLayoutGain loudness_gains = 25;
}

message EndSession {
  string session_id = 1;
}

message CollectLogs {
  string session_id = 1;
}

message FetchArtifact {
  string session_id = 1;
  string name = 2;
}
