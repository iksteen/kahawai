// Satellite control-plane links (AR-3, AR-7). Requires mTLS; the client
// certificate's URI SAN is the identity — no token in any message.
syntax = "proto3";
package kahawai.v1;

// SEC-7: certificate renewal over the already-authenticated channel. The
// hub admits the new fingerprint (DB + live allowlist) before the renewed
// certificate is returned, so a satellite can never lock itself out.
service Renewal {
  rpc Renew(RenewRequest) returns (RenewResponse);
}

message RenewRequest {
  bytes csr_der = 1;
}

message RenewResponse {
  string cert_pem = 1;
}

service MediahostLink {
  rpc Link(stream HostToHub) returns (stream HubToHost);
  // Byte plane (AR-10): opened by the host in response to OpenRead, bound
  // to a lease by the first chunk's token. The hub sends ReadRequests down;
  // the host answers each with data chunks ending in an eof marker.
  // ponytail: rides gRPC instead of the doc's raw framed-TCP listener —
  // same shapes, one less port; swap the transport if profiling demands.
  rpc ByteChannel(stream ByteChunk) returns (stream ReadRequest);
}

message HostToHub {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    AnnounceCollection announce_collection = 3;
    FileUpsert file_upsert = 4;
    FileError file_error = 5;
    ScanProgress scan_progress = 6;
    // Incremental rescan (MH-5): ask what the hub already knows, then
    // report unchanged files as seen without re-inspecting them.
    ManifestRequest manifest_request = 7;
    FilesSeen files_seen = 8;
    // ED2K results (MH-9), trickled in as the idle hasher finishes files.
    FileHashes file_hashes = 9;
    // Extracted subtitle tracks of one file (efficiency ladder step 2).
    FileSubtitles file_subtitles = 10;
    // Attachment declarations for one file (MH-4 backfill).
    FileAttachments file_attachments = 11;
    // HUB-32b: one image subtitle track's raw display-set blocks,
    // walked from the container index on the host's own disk.
    ImageSubtitles image_subtitles = 12;
  }
}

message FileSubtitles {
  string collection_id = 1;
  string path_rel = 2;
  // Size at extraction time: the hub drops the result if the row moved on.
  uint64 size = 3;
  repeated SubTrack tracks = 4;
  // Whole-file failure (unreadable, no text tracks despite discovery…).
  string error = 5;
}

message SubTrack {
  // "e{n}" — same demux-order indexing as discovery and the session tap.
  string key = 1;
  // Faithful ASS script (ASS/SSA tracks), empty otherwise.
  string ass = 2;
  // Flattened cues as JSON [{start_ms,end_ms,text}…] (hub cache shape).
  string cues_json = 3;
}

message FileHashes {
  string collection_id = 1;
  repeated FileHash hashes = 2;
}

message FileHash {
  string path_rel = 1;
  // eMule/AniDB variant (null chunk appended on exact chunk multiples).
  string ed2k_hex = 2;
  // Size at hash time: the hub ignores the result if the row moved on.
  uint64 size = 3;
  // Filename-embedded CRC32 verified during the same read (MH-9).
  bool crc_checked = 4;
  bool crc_ok = 5;
}

message ManifestRequest {
  string collection_id = 1;
  // The host's persisted scan generation. Non-zero and equal to the
  // hub's stored value → the hub answers in_sync and the host skips
  // the scan. 0 = no shortcut (watcher/sweep/manual cycles).
  uint64 sync_version = 2;
}

message FileStat {
  string path_rel = 1;
  uint64 size = 2;
  int64 mtime_unix = 3;
  // The sidecars the hub has recorded for this file (.nfo, artwork), so
  // the host can notice one that appeared or vanished. Size and mtime
  // describe the MEDIA file and never move when a sidecar changes beside
  // it, which is why a dropped-in .nfo used to stay invisible forever.
  string sidecars = 4;
}

// The hub's current knowledge of a collection, chunked; `done` on the
// last chunk.
message Manifest {
  string collection_id = 1;
  repeated FileStat entries = 2;
  bool done = 3;
  // Versions matched: no entries follow, skip the scan entirely.
  bool in_sync = 4;
  // The hub filled FileStat.sidecars. Absent from an older hub, where an
  // empty signature means "not sent" rather than "none recorded", so the
  // host must not read anything into it.
  bool sidecars_compared = 5;
}

// Files present and unchanged (size+mtime match the manifest): counted
// for reconciliation, no re-inspection, no upsert.
message FilesSeen {
  string collection_id = 1;
  repeated string path_rel = 2;
}

// A collection this mediahost serves (MH-1). Announced after Hello and
// whenever configuration changes.
message AnnounceCollection {
  // Stable per-mediahost collection identifier (the configured name).
  string id = 1;
  string media_type = 2; // series|movies|music|anime
  repeated string roots = 3;
}

message FileUpsert {
  string collection_id = 1;
  repeated FileRecord files = 2;
}

message FileRecord {
  string path_rel = 1;
  uint64 size = 2;
  int64 mtime_unix = 3;
  // Content identity (MH-5): xxh3 of first/last 64 KiB.
  uint64 head_xxh3 = 4;
  uint64 tail_xxh3 = 5;
  // OpenSubtitles moviehash, same read pass (MH-5/HUB-22).
  uint64 oshash = 6;
  // kahawai_core::media::MediaInfo as JSON (schema evolves without proto churn).
  string streams_json = 7;
}

// Unreadable/corrupt file diagnostic (MH-8).
message FileError {
  string collection_id = 1;
  string path_rel = 2;
  string error = 3;
}

message ScanProgress {
  string collection_id = 1;
  uint32 scanned = 2;
  uint32 failed = 3;
  bool complete = 4;
  uint32 skipped = 5; // unchanged, not re-inspected
  // Scan generation after this cycle; the hub stores it (see
  // ManifestRequest.sync_version).
  uint64 sync_version = 6;
}

message HubToHost {
  oneof msg {
    HelloAck hello_ack = 1;
    // Ask the host to open a ByteChannel for this file (MH-6). The lease
    // ends when the hub closes the channel's request stream.
    OpenRead open_read = 2;
    Manifest manifest = 3;
    // Admin-triggered incremental rescan ("" = every collection).
    RescanRequest rescan_request = 4;
    // Files the hub wants ED2K hashes for (MH-9, anime collections).
    // Consumed by the host's idle hasher; chunked, no ordering contract.
    Hashlist hashlist = 5;
    // Subtitle extraction: urgent single file (a viewer is waiting) …
    ExtractSubs extract_subs = 6;
    // … or background pre-warm, drained below the ED2K queue.
    SubsWorklist subs_worklist = 7;
    // MH-4 backfill: declare attachments for files scanned before
    // declaration existed. Cheapest tier (header reads only).
    AttachmentsWorklist attachments_worklist = 8;
    // HUB-32b: read one image subtitle track's display-set blocks.
    // Index-driven and free on local disk; the hub cannot do this
    // itself because every read would cross the byte plane.
    ExtractImageSubs extract_image_subs = 9;
  }
}

message ExtractSubs {
  string collection_id = 1;
  string path_rel = 2;
}

message ExtractImageSubs {
  string collection_id = 1;
  string path_rel = 2;
  // Which subtitle track, in the e{n} numbering discovery uses.
  uint32 sub_index = 3;
}

/// One image subtitle track, undecoded: the payloads are still PGS
/// segments / VobSub SPUs, which is both the compact form and the one
/// the pipeline worker's own decoders take.
message ImageSubtitles {
  string collection_id = 1;
  string path_rel = 2;
  uint32 sub_index = 3;
  // Matroska CodecID (S_HDMV/PGS, S_VOBSUB); empty = no such track.
  string codec = 4;
  // CodecPrivate: VobSub's .idx text (palette + canvas size).
  bytes codec_private = 5;
  repeated ImageSubBlock blocks = 6;
  string error = 7;
}

message ImageSubBlock {
  uint64 start_ms = 1;
  // 0 = undeclared; the set then ends where the next one begins.
  uint64 duration_ms = 2;
  bytes payload = 3;
}

message SubsWorklist {
  string collection_id = 1;
  repeated string paths = 2;
}

message AttachmentsWorklist {
  string collection_id = 1;
  repeated string paths = 2;
}

message FileAttachments {
  string collection_id = 1;
  string path_rel = 2;
  // Size at declaration time: the hub drops the result if the row moved on.
  uint64 size = 3;
  // JSON array of {file_name, mime_type, offset, size} — exactly what
  // MediaInfo.attachments serializes to. "[]" = checked, none found.
  string attachments_json = 4;
}

message Hashlist {
  string collection_id = 1;
  repeated string paths = 2;
}

message RescanRequest {
  string collection_id = 1;
}

message OpenRead {
  string lease_token = 1;
  string collection_id = 2;
  string path_rel = 3;
}

message ByteChunk {
  // Set on the first chunk only: binds the channel to a lease.
  string lease_token = 1;
  uint64 offset = 2;
  bytes data = 3;
  // Marks the end of one ReadRequest's data.
  bool eof = 4;
  string error = 5;
}

message ReadRequest {
  uint64 offset = 1;
  uint64 len = 2;
}

// First message on every link (AR-7): version negotiation input.
message Hello {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  string name = 3;
}

message HelloAck {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
}

message Heartbeat {}

// ---- Transcoder control link (§6, M3) ------------------------------------

service TranscoderLink {
  rpc Link(stream TcToHub) returns (stream HubToTc);
}

message TcToHub {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    // Sent once after HelloAck (TC-1): what this box can actually do,
    // every element dry-run-verified at startup.
    CapabilityReport capabilities = 3;
    SessionReady session_ready = 4;
    SessionError session_error = 5;
    // Source byte plane and artifact delivery ride the control link
    // (ponytail: same shapes as a dedicated channel, one less stream;
    // split out if profiling demands).
    SourceRead source_read = 6;
    ArtifactData artifact_data = 7;
  }
}

message SessionReady {
  string session_id = 1;
}

message SessionError {
  string session_id = 1;
  string error = 2;
}

// Transcoder pulls source bytes. `req` correlates request/response:
// session_id alone is NOT enough — a seek-restart reuses the session id,
// and a read left in flight by the killed worker must never satisfy the
// new worker's first read (observed: avidemux fed mid-file bytes as a
// header).
message SourceRead {
  string session_id = 1;
  uint64 offset = 2;
  uint64 len = 3;
  uint64 req = 4;
  // Which part of a split source (CD1/CD2) this read is for, indexed from
  // the session's starting part. Absent/0 = the first — what every
  // single-part session and every pre-split transcoder sends.
  uint32 part = 5;
}

message SourceData {
  string session_id = 1;
  uint64 offset = 2;
  // Shorter than requested (including empty) = EOF at that offset.
  bytes data = 3;
  uint64 req = 4;
  uint32 part = 5;
}

// One artifact (playlist/segment) streamed in chunks, eof-terminated.
message ArtifactData {
  string session_id = 1;
  string name = 2;
  bytes data = 3;
  bool eof = 4;
  string error = 5;
}

message CapabilityReport {
  repeated EncoderCap encoders = 1;
  uint32 max_sessions = 2;
  // Caps names this box can decode (registry-derived). Placement must
  // match the SOURCE codec too: a box can own a great encoder and still
  // decode AV1 at 0.3x realtime in software (observed on a J5005).
  repeated string decode_caps = 3;
  // HUB-15a: the GL tone-map segment (glshader + friends) is available.
  bool tonemap = 4;
}

message EncoderCap {
  string codec = 1;   // h264 | aac | ...
  string element = 2; // the verified GStreamer element
  bool hardware = 3;  // hw-accelerated (placement prefers these)
}

message HubToTc {
  oneof msg {
    HelloAck hello_ack = 1;
    StartSession start_session = 2;
    EndSession end_session = 3;
    SourceData source_data = 4;
    FetchArtifact fetch_artifact = 5;
    // Pacing (§4.6): the viewer's last reported position, forwarded so
    // the worker can throttle its lead.
    ViewerPosition viewer_position = 6;
    // Liveness probe: macOS App Nap defers idle processes' timers (their
    // own heartbeat ticker stalls) but socket reads always wake them, so
    // the hub pings and the transcoder answers with a Heartbeat.
    Ping ping = 7;
  }
}

message Ping {}

message ViewerPosition {
  string session_id = 1;
  uint64 position_ms = 2;
}

message StartSession {
  string session_id = 1;
  uint64 size = 2;
  string video = 3; // copy | encode | off
  string audio = 4;
  // Seek-restart (§6): begin at this offset (keyframe-snapped).
  uint64 start_ms = 5;
  // HLS sink override (empty = preference order). Set on retry after a
  // sink crash (TC-6 fallback: hlssink3 bugs, hlssink2 works).
  string sink = 6;
  // Track indexes in discovery order (HUB-27). Old transcoders
  // ignore these and play track 0.
  uint32 audio_track = 7;
  uint32 video_track = 8;
  // Sizes of the remaining parts of a split source in timeline order,
  // EXCLUDING the first (that is `size`). A transcoder that understands
  // this joins them into one pipeline and plays the CD1->CD2 boundary
  // without restarting; one that does not ignores it and restarts, which
  // is exactly today's behaviour.
  repeated uint64 tail_sizes = 9;
  // HUB-15 encode parameters; 0 = unset (historical fixed values). Old
  // transcoders ignore them entirely.
  uint32 video_kbps = 10;
  uint32 max_height = 11;
  uint32 max_channels = 12;
  // HUB-15a: tone-map HDR video to SDR in the encode chain (GL shader).
  // Only set when this box reported the capability.
  bool tone_map = 13;
  // HUB-32b: burn this image subtitle track into the picture, as
  // 1 + the e{n} index (0 = burn nothing, so old transcoders that
  // ignore the field simply do not burn).
  uint32 burn_subtitle = 14;
  // The display sets to burn, in the worker's own on-disk format. Sent
  // with the session because a dispatched worker can no more walk the
  // source index than the hub can — every read would cross the byte
  // plane. Empty = nothing to burn.
  bytes burn_sets = 15;
}

message EndSession {
  string session_id = 1;
}

message FetchArtifact {
  string session_id = 1;
  string name = 2;
}
