name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  prepare:
    name: prepare stamped source
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      tag_commit: ${{ steps.prepare.outputs.tag_commit }}
      release_commit: ${{ steps.prepare.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install pinned workspace version editor
        run: cargo install --locked cargo-edit --version 0.13.13
      - name: Fetch an existing reproducibility branch
        run: git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" || true
      - name: Create or verify the stamped branch
        id: prepare
        run: scripts/kahawai-release-prepare.sh "$GITHUB_REF_NAME"

  source-gates:
    name: stamped source gates
    needs: prepare
    runs-on: ubuntu-26.04
    env:
      # A release source gate must exercise the same complete binary boundary
      # as the container build, never an accidentally UI-less Rust build.
      KAHAWAI_REQUIRE_WEB: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libass-dev libva-dev libgudev-1.0-dev \
            libleptonica-dev libtesseract-dev \
            protobuf-compiler clang cmake
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-26.04-release-source-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-26.04-release-source-rust-1.97.1-
      - name: Verify stamped identity
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python3 - "$EXPECTED_VERSION" "$RUNNER_TEMP/metadata.json" <<'PY'
          import json, pathlib, sys
          expected, path = sys.argv[1:]
          packages = json.loads(pathlib.Path(path).read_text())["packages"]
          wrong = [f'{p["name"]}={p["version"]}' for p in packages if p["version"] != expected]
          if wrong:
              raise SystemExit("workspace version mismatch: " + ", ".join(wrong))
          PY
      # Generated assets are absent from Git. Build them before any Cargo step
      # that compiles kahawai-hub so rust-embed sees the release bundle.
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets
      # DATA-7 gates the artifact-producing path, not only type checking.
      - run: cargo build --locked --workspace --no-default-features
      - run: npm run fmt:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      # Release the browser policy only after Chromium has executed the exact
      # stamped bundle, including JASSUB's worker and WASM. Keep the install
      # paired with the lockfile-pinned Playwright package.
      - run: npx playwright install --with-deps --no-shell chromium
        working-directory: web
      - run: npm run test:csp
        working-directory: web

  draft-release:
    name: create draft release
    needs: [prepare, source-gates]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.release_commit }}
      - name: Create or resume draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          test -n "$title"
          git for-each-ref --format='%(contents:body)' "refs/tags/$TAG" > "$RUNNER_TEMP/notes.md"
          if ! test -s "$RUNNER_TEMP/notes.md"; then
            printf '%s\n' "$title" > "$RUNNER_TEMP/notes.md"
          fi
          {
            printf '\n---\n\n'
            printf 'Reproducible source branch: `%s`  \n' "refs/heads/$TAG"
            printf 'Release source commit: `%s`  \n' "$RELEASE_COMMIT"
            printf 'The attached bare binaries require a compatible Ubuntu 26.04 media stack; the container image is the supported artifact.\n'
          } >> "$RUNNER_TEMP/notes.md"

          if release="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            test "$(printf '%s' "$release" | jq -r .isDraft)" = true
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          elif test "$PRERELEASE" = true; then
            gh release create "$TAG" --verify-tag --draft --prerelease \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  image:
    name: image (${{ matrix.platform }})
    needs: [prepare, draft-release]
    environment: release
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux/amd64
            arch: x86_64
            cache: amd64
          - runner: ubuntu-26.04-arm
            platform: linux/arm64
            arch: aarch64
            cache: arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kahawai
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_commit }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push canonical digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: KAHAWAI_BUILD=${{ needs.prepare.outputs.tag }}@${{ needs.prepare.outputs.release_commit }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=kahawai-release-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=kahawai-release-${{ matrix.cache }}
      - name: Smoke-test the exact pushed image
        run: scripts/kahawai-container-smoke.sh -t "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Verify packaged version
        run: |
          actual="$(docker run --rm "$IMAGE@${{ steps.build.outputs.digest }}" --version)"
          test "$actual" = "kahawai $VERSION"
      - name: Export the identical tested binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: binary-artifact
          platforms: ${{ matrix.platform }}
          build-args: KAHAWAI_BUILD=${{ needs.prepare.outputs.tag }}@${{ needs.prepare.outputs.release_commit }}
          outputs: type=local,dest=${{ runner.temp }}/binary
          cache-from: type=gha,scope=kahawai-release-${{ matrix.cache }}
      - name: Package architecture outputs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          package="$RUNNER_TEMP/package/kahawai-$VERSION-linux-$ARCH"
          mkdir -p "$package"
          install -m 0755 "$RUNNER_TEMP/binary/kahawai" "$package/kahawai"
          cat > "$package/UNSUPPORTED-NATIVE-BINARY.txt" <<'EOF'
          This is an unsupported convenience binary built against Ubuntu 26.04.
          It does not bundle Kahawai's required GStreamer libraries or plugins.
          Use the release's multi-architecture container for the tested runtime.
          EOF
          tar -C "$RUNNER_TEMP/package" -czf \
            "$RUNNER_TEMP/kahawai-$VERSION-linux-$ARCH.tar.gz" \
            "kahawai-$VERSION-linux-$ARCH"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest-${{ matrix.cache }}.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.cache }}
          path: |
            ${{ runner.temp }}/kahawai-*.tar.gz
            ${{ runner.temp }}/digest-${{ matrix.cache }}.txt
          if-no-files-found: error

  publish:
    name: publish tested release
    needs: [prepare, image]
    environment: release
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/kahawai
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        run: |
          amd64="$(cat "$RUNNER_TEMP/release-assets/digest-amd64.txt")"
          arm64="$(cat "$RUNNER_TEMP/release-assets/digest-arm64.txt")"
          refs=(--tag "$IMAGE:$VERSION")
          if test "$PRERELEASE" = false; then
            minor="${VERSION%.*}"
            refs+=(--tag "$IMAGE:$minor" --tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${refs[@]}" "$IMAGE@$amd64" "$IMAGE@$arm64"
      - name: Package stamped source and checksums
        run: |
          assets="$RUNNER_TEMP/release-assets"
          git archive --format=tar.gz --prefix="kahawai-$VERSION/" \
            -o "$assets/kahawai-$VERSION-source.tar.gz" "$RELEASE_COMMIT"
          # The API contract as a release artifact, so a third-party client
          # can generate against a fixed version without cloning or running
          # the hub. Taken from the stamped release commit, so `info.version`
          # is this release rather than `0.0.0-dev`.
          cp web/openapi.json "$assets/kahawai-openapi.json"
          cd "$assets"
          sha256sum kahawai-*.tar.gz kahawai-openapi.json > SHA256SUMS
      - name: Publish GitHub release
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP/release-assets"/kahawai-*.tar.gz \
            "$RUNNER_TEMP/release-assets/kahawai-openapi.json" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS" --clobber
          if test "$PRERELEASE" = true; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false
          fi
