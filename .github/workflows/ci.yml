name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first one's answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning nobody fails on is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Enough to COMPILE against: the bindings need gstreamer-1.0 >= 1.14
      # and Ubuntu ships far newer. The plugin set the container image
      # builds from source matters at runtime, not here — clippy never
      # starts a pipeline.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libass-dev libva-dev libgudev-1.0-dev \
            libleptonica-dev libtesseract-dev \
            protobuf-compiler clang cmake

      - run: rustup component add clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --all-targets so tests and benches are linted too: they are where
      # the checks live, and an unlinted test is how a check that cannot
      # fail gets written.
      - run: cargo clippy --locked --workspace --all-targets
