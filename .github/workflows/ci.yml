name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first one's answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A warning nobody fails on is a warning nobody reads.
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libass-dev libva-dev libgudev-1.0-dev \
            libleptonica-dev libtesseract-dev \
            protobuf-compiler clang cmake
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-26.04-clippy-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-26.04-clippy-rust-1.97.1-
      - name: Record toolchain
        run: |
          {
            echo '### Clippy environment'
            echo '```text'
            sed -n '1,6p' /etc/os-release
            rustc --version
            cargo --version
            pkg-config --modversion gstreamer-1.0
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # --all-targets includes the checks themselves: an unlinted test is
      # how a check that cannot fail gets written.
      - run: cargo clippy --locked --workspace --all-targets

  test:
    name: workspace tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            ca-certificates ffmpeg \
            libass-dev libva-dev libgudev-1.0-dev \
            libleptonica-dev libtesseract-dev tesseract-ocr-eng \
            protobuf-compiler clang cmake
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-26.04-test-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-26.04-test-rust-1.97.1-
      - name: Record media stack
        run: |
          {
            echo '### Workspace-test environment'
            echo '```text'
            sed -n '1,6p' /etc/os-release
            rustc --version
            gst-inspect-1.0 --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Cargo's hub build embeds the production bundle, so install its pinned
      # toolchain before compiling either the workspace or the browser fixture.
      - run: npm ci
        working-directory: web
      - run: cargo test --locked --workspace
        env:
          KAHAWAI_MEDIA_SKIP_FILE: ${{ runner.temp }}/kahawai-media-skips.txt
      # SEC-WEB-1 is a browser contract: execute the production bundle, its
      # JASSUB worker/WASM path, negative CSP cases, and the real all-in-one
      # product journey in branded Chrome. Playwright documents both the
      # browser-specific install and `channel: chrome`:
      # https://playwright.dev/docs/browsers
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chrome
        working-directory: web
      - run: npm run test:csp
        working-directory: web
      - run: npm run test:product -- --project=chromium
        working-directory: web
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-chrome-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Report media paths not exercised
        if: always()
        env:
          KAHAWAI_MEDIA_SKIP_FILE: ${{ runner.temp }}/kahawai-media-skips.txt
        run: |
          if test -s "$KAHAWAI_MEDIA_SKIP_FILE"; then
            {
              echo '### Media prerequisites unavailable'
              echo 'The distro-stack job did not exercise these paths:'
              echo '```text'
              sort -u "$KAHAWAI_MEDIA_SKIP_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Media prerequisites unavailable: none' >> "$GITHUB_STEP_SUMMARY"
          fi

  no-default-features:
    name: no default features
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libass-dev libva-dev libgudev-1.0-dev \
            protobuf-compiler clang cmake
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ubuntu-26.04-no-default-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-26.04-no-default-rust-1.97.1-
      # DATA-7 is a complete-build promise: `check` can miss link/build-script
      # failures in the feature-off artifact.
      - run: cargo build --locked --workspace --no-default-features

  web:
    name: web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Record toolchain
        run: |
          {
            echo '### Web environment'
            echo '```text'
            sed -n '1,6p' /etc/os-release
            node --version
            npm --version
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
        working-directory: web
      - run: npm run fmt:check
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      # This is both the production-bundle gate and proof that a clean checkout
      # can generate the ignored rust-embed input. Generated hashes are native-
      # toolchain details and are deliberately not compared with Git.
      - run: npm run build
        working-directory: web

  browser-webkit:
    name: product browser (WebKit/macOS)
    runs-on: macos-15
    env:
      # The fixture needs production pipelines, not debug symbols; this keeps
      # the complete Rust/media build inside the standard runner's 14 GB disk.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Homebrew's current GStreamer formula bundles all gst-* plugins and
      # their codec dependencies: https://formulae.brew.sh/formula/gstreamer
      - name: Install media build dependencies
        run: brew install gstreamer tesseract protobuf cmake pkgconf
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: macos-15-browser-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-15-browser-rust-1.97.1-
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npx playwright install webkit
        working-directory: web
      - run: npm run test:product -- --project=webkit
        working-directory: web
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-webkit-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
