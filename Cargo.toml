[workspace]
resolver = "3"
members = ["crates/*"]
# Bare `cargo run` / `cargo build` target the kahawai binary; use
# --workspace for the full build/test sweep.
default-members = ["crates/kahawai"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
kahawai-core = { path = "crates/kahawai-core" }
kahawai-hub = { path = "crates/kahawai-hub" }
kahawai-media = { path = "crates/kahawai-media" }
kahawai-mediahost = { path = "crates/kahawai-mediahost" }
kahawai-proto = { path = "crates/kahawai-proto" }
kahawai-transcoder = { path = "crates/kahawai-transcoder" }
kahawai-transport = { path = "crates/kahawai-transport" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
sha2 = "0.10"
data-encoding = "2"
time = "0.3"
tempfile = "3"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1.12"
tokio-stream = "0.1"
tower = "0.5"
hyper-util = "0.1"
ulid = "1"
gstreamer = "0.25"
gstreamer-pbutils = "0.25"
serde_json = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
axum = "0.8"
rust-embed = "8"
libc = "0.2"
