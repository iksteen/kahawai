[workspace]
resolver = "3"
members = ["crates/*"]
# Bare `cargo run` / `cargo build` target the kahawai binary; use
# --workspace for the full build/test sweep.
default-members = ["crates/kahawai"]

[workspace.package]
version = "0.0.11-rc.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
kahawai-core = { path = "crates/kahawai-core" }
kahawai-hub = { path = "crates/kahawai-hub", default-features = false }
kahawai-intro = { path = "crates/kahawai-intro" }
kahawai-media = { path = "crates/kahawai-media" }
kahawai-mediahost = { path = "crates/kahawai-mediahost" }
kahawai-mediahostd = { path = "crates/kahawai-mediahostd" }
kahawai-runtime = { path = "crates/kahawai-runtime" }
kahawai-sqlite = { path = "crates/kahawai-sqlite" }
kahawai-transcoderd = { path = "crates/kahawai-transcoderd" }
kahawai-proto = { path = "crates/kahawai-proto" }
kahawai-transcoder = { path = "crates/kahawai-transcoder" }
kahawai-transport = { path = "crates/kahawai-transport" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
md4 = "0.11"
crc32fast = "1"
flate2 = "1"
zstd = "0.13"
md-5 = "0.11"
png = "0.18"
# Only the three formats artwork is ever served in. The default feature
# set pulls in a dozen decoders we would never reach.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.23"
async-trait = "0.1"
aes = "0.9"
sha2 = "0.11"
hmac = "0.13"
data-encoding = "2"
time = "0.3"
tempfile = "3"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1.12"
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
hyper-util = "0.1"
ulid = "3"
gstreamer = "0.25"
gstreamer-audio = "0.25"
gstreamer-pbutils = "0.25"
ebur128 = "0.1.10"
serde_json = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "webpki-roots", "http2"] }
roxmltree = "0.21"
ipnet = "2"
tower-http = { version = "0.7", default-features = false, features = ["cors", "compression-gzip"] }
notify = "8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
async-stream = "0.3"
either = "1"
futures-util = "0.3"
axum = "0.8"
rust-embed = "8"
libc = "0.2"
rpassword = "7"
url = "2"
utoipa = { git = "https://github.com/juhaku/utoipa", rev = "e092565a9724b07a5ebf122e80ffa3d70addbe5d" }
utoipa-swagger-ui = { git = "https://github.com/juhaku/utoipa", rev = "e092565a9724b07a5ebf122e80ffa3d70addbe5d", default-features = false, features = ["axum", "vendored"] }
